[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "cairo",
  "pango", 
  "gdk-pixbuf",
  "libffi",
  "glib",
  "gobject-introspection"
]

[phases.install]
cmds = ["pip install -r api/requirements.txt"]

[phases.build]
cmds = ["echo 'Build phase complete'"]

[start]
cmd = "cd api && python app.py"
